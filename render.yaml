services:
  - type: web
    name: telegram-shop
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_ENABLED
        value: "0"
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-shop-db
          property: connectionString

databases:
  - name: telegram-shop-db
    plan: free
    ipAllowList: []
